windows:
  range: hamming
  doppler: hamming

calibration:
  dc_offset:
    enabled: true
    method: per_channel
  channel_equalization:
    enabled: true
    method: rms
  clutter_removal:
    enabled: true

angle:
  mode: 2d_fft
  azimuth_range: [-60.0, 60.0]
  elevation_range: [-30.0, 30.0]
  azimuth_fft_size: 64
  elevation_fft_size: 32
  spatial_window:
    azimuth: hamming
    elevation: hann

polar_detection:
  method: quantile
  power_quantile: 0.985
  guard: [1, 1, 2]
  train: [4, 3, 6]
  pfa: 0.0001
  doppler_guard_bins: 2

point_cloud:
  range_scale: 0.65
  power_normalization:
    min: 0.000001
    max: 255.0
    clip_input_max: null
  roi:
    enabled: true
    x: [0.0, 120.0]
    y: [-8.0, 8.0]
    z: [-2.0, 6.0]
