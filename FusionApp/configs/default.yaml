windows:
  range: hamming
  doppler: hamming

calibration:
  dc_offset:
    enabled: true
    method: per_channel
  channel_equalization:
    enabled: true
    method: rms
  clutter_removal:
    enabled: true

angle:
  mode: 1d_fft
  azimuth_range: [-53.0, 53.0]
  elevation_range: [-18.0, 18.0]
  azimuth_fft_size: 64
  elevation_fft_size: 32
  spatial_window: hamming

polar_detection:
  method: quantile
  power_quantile: 0.85
  guard: [1, 1, 2]
  train: [4, 3, 6]
  pfa: 0.001
  doppler_guard_bins: 0

point_cloud:
  generation_mode: cartesian_quantile
  range_scale: 1.0
  power_normalization:
    divide_by: 900000.0
    range_based_divide_by:
      default: 900000.0
      "0-10": 4000000.0
      "10-15": 1000000.0
      "15-20": 4000000.0
      "20-30": 1000000.0
      "30-40": 200000.0
      "40-50": 50000.0
      "50-60": 10000.0
      "60-70": 10000.0
      "70-80": 100.0
      "80-90": 1000.0
      "90-100": 1000.0
    clip_input_max: null
  roi:
    enabled: true
    x: [0.0, 100.0]
    y: [-6.2, 6.2]
    z: [-1.8, 5.8]
  cartesian_quantile:
    quantile_rate: 0.1
    add_half_grid_offset: false
    offset_type: minus
    doppler_aggregation: mean
    include_doppler: false
    grid_size: 0.4
  x_limits: [0.0, 99.6]
  y_limits: [-80.0, 79.6]
  z_limits: [-30.0, 29.6]
